# CLI tools, installed with `mise install`. mise itself comes from the
# provisioning playbook. Bare names resolve through mise's registry, mostly to
# aqua packages; the prefixed ones are not in any registry.

[settings]
# Installs yarn and pnpm shims alongside each node version.
node.corepack = true
minimum_release_age = "7d"

[tools]

# Generic
navi = "latest"
fzf = "latest"
tlrc = "latest"

# PHP
"github:symfony-cli/symfony-cli" = "5"

# Kubernetes
kubectl = "1.36"
flux2 = "latest"
helm = "4"
k9s = "latest"
kind = "latest"
kube-linter = "latest"
kubeconform = "latest"
kubeseal = "latest"
nova = "latest"
opa = "latest"
"github:cloudnative-pg/cloudnative-pg" = "1"
"github:home-operations/flate" = "latest"
"github:robusta-dev/krr" = "latest"

# GitHub
github-cli = "latest"
actionlint = "latest"
zizmor = "latest"

# Security scanning
semgrep = "latest"
snyk = "latest"
trufflehog = "latest"

# Cloud
doctl = "1"
terraform = "latest"
"github:StackExchange/dnscontrol" = "latest"

# Node
node = "lts"
markdownlint-cli2 = "latest"

# Other
k6 = "latest"

# required for mise completion
usage = "latest"
